name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned analyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
      - name: Run canonical quality checks
        shell: pwsh
        run: ./tools/Invoke-Quality.ps1

  test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Pester
        shell: ${{ matrix.shell }}
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Run canonical tests and packaged CLI smoke
        shell: ${{ matrix.shell }}
        run: ./tools/Invoke-Tests.ps1

  release:
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive version strings
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          echo "TAG=$TAG"   >> "$GITHUB_OUTPUT"
          echo "VER=$VER"   >> "$GITHUB_OUTPUT"

      - name: Validate tagged package identity
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.TAG }}
          RELEASE_VERSION: ${{ steps.ver.outputs.VER }}
        run: |
          $module = Import-PowerShellDataFile ./SPX.psd1
          $moduleVersion = [string]$module.ModuleVersion
          $prerelease = [string]$module.PrivateData.PSData.Prerelease
          if ($prerelease) { $moduleVersion = "$moduleVersion-$prerelease" }
          $package = Get-Content ./spx.json -Raw | ConvertFrom-Json
          $expectedUrl = "https://github.com/$env:GITHUB_REPOSITORY/archive/refs/tags/$env:RELEASE_TAG.zip"
          if ($env:RELEASE_TAG -ne "v$env:RELEASE_VERSION") { throw 'Tag/version identity is invalid.' }
          if ($moduleVersion -ne $env:RELEASE_VERSION) { throw 'SPX.psd1 does not match the release tag.' }
          if ([string]$package.version -ne $env:RELEASE_VERSION) { throw 'spx.json does not match the release tag.' }
          if ([string]$package.url -ne $expectedUrl) { throw 'spx.json URL does not match the immutable tag archive.' }
          if ([string]$package.extract_dir -ne "spx-$env:RELEASE_VERSION") { throw 'spx.json extract_dir does not match the release tag.' }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name:         ${{ steps.ver.outputs.TAG }}
          name:             SPX ${{ steps.ver.outputs.TAG }}
          generate_release_notes: true
          draft:            false
          prerelease: >-
            ${{
              contains(steps.ver.outputs.TAG, '-rc')   ||
              contains(steps.ver.outputs.TAG, '-beta')  ||
              contains(steps.ver.outputs.TAG, '-alpha')
            }}

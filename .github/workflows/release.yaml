name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/test.yaml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tagged package identity
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $module = Import-PowerShellDataFile ./SPX.psd1
          $version = [string]$module.ModuleVersion
          if ($module.PrivateData.PSData.Prerelease) { $version += '-' + $module.PrivateData.PSData.Prerelease }
          $package = Get-Content ./spx.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag does not match SPX.psd1.' }
          if ([string]$package.version -cne $version) { throw 'Tag does not match spx.json.' }
          $expectedUrl = "https://github.com/$env:GITHUB_REPOSITORY/archive/refs/tags/$env:RELEASE_TAG.zip"
          if ([string]$package.url -cne $expectedUrl) { throw 'Package URL does not match the tagged repository.' }
          if ([string]$package.extract_dir -cne "spx-$version") { throw 'Package extract_dir does not match the tag.' }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: SPX ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
